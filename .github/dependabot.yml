version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot reads the `# vX.Y.Z`
  # comment next to each pinned SHA and bumps both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # Dev tooling (pnpm devDependencies: stylelint). The site itself is zero-dep.
  # Grouping matters here: stylelint's transitive tree is where the advisories
  # land, and they arrive together.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      npm-dev:
        applies-to: version-updates
        patterns: ["*"]
